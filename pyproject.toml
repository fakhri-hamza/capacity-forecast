[project]
name = "capfc"
version = "0.2.0"
description = "Anomaly detection and day-ahead capacity forecasting on real AWS CloudWatch metrics (NAB)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
